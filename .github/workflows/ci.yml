name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Java 21 / Tycho verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        shell: bash
        run: |
          chmod +x mvnw
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Upload headless test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: headless-surefire-reports
          path: dev.lonsing.eclipse.plugins.gotoproject.tests/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload UI test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-surefire-reports
          path: dev.lonsing.eclipse.plugins.gotoproject.ui.tests/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 30
